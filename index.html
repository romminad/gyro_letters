<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>Gyro Letter Discs</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ff1a0d;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    input, button {
      font-size: 14px;
      border-radius: 999px;
      border: none;
      padding: 10px 14px;
      outline: none;
    }

    input {
      width: 150px;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
